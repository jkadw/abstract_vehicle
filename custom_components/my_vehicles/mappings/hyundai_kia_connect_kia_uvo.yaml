integration:
  domain: kia_uvo
  friendly_name: Hyundai / Kia Connect

capabilities:
  lock_vehicle:
    state:
      entity: lock.{vehicle}_door_lock
    actions:
      lock:
        action: kia_uvo.lock
        availability_not:
          entity: lock.{vehicle}_door_lock
        data:
          device_id: {device}
      unlock:
        action: kia_uvo.unlock
        availability:
          entity: lock.{vehicle}_door_lock
        data:
          device_id: {device}

  climate:
    state:
      entity: binary_sensor.{vehicle}_air_conditioner
    actions:
      start_heating:
        action: kia_uvo.start_climate
        availability_not:
          entity: switch.{vehicle}_{vehicle}_climate
        data:
          device_id: {device}
          temperature: 23
          duration: 10
          climate: true
          heating: "4"
          flseat: "7"
          frseat: "7"
      start_cooling:
        action: kia_uvo.start_climate
        availability_not:
          entity: switch.{vehicle}_{vehicle}_climate
        data:
          device_id: {device}
          temperature: 19
          duration: 10
          climate: true
          heating: "0"
          flseat: "5"
          frseat: "5"
      stop:
        action: kia_uvo.stop_climate
        availability:
          entity: switch.{vehicle}_{vehicle}_climate
        data:
          device_id: {device}

  fuel_level:
    state:
      entity: sensor.{vehicle}_fuel_level

  fuel_driving_range:
    state:
      entity: sensor.{vehicle}_fuel_driving_range

  ev_battery_level:
    state:
      entity: sensor.{vehicle}_ev_battery_level

  ev_driving_range:
    state:
      entity: sensor.{vehicle}_ev_range

  ev_plugged_in:
    state:
      entity: binary_sensor.{vehicle}_ev_battery_plug

  ev_charging:
    availability:
      entity: binary_sensor.{vehicle}_ev_battery_plug
    state:
      entity: switch.{vehicle}_{vehicle}_ev_charging
    actions:
      start:
        action: kia_uvo.start_charge
        data:
          device_id: {device}
      stop:
        action: kia_uvo.stop_charge
        data:
          device_id: {device}

  vehicle_alert:
    state:
      unavailable: true

  hazard_lights:
    state:
      unavailable: true
    actions:
      turn_on:
        action: kia_uvo.start_hazard_lights
        data:
          device_id: {device}

  location:
    state:
      entity: device_tracker.{vehicle}_location

  ignition:
    state:
      entity: binary_sensor.{vehicle}_engine

  driving_range:
    state:
      entity: sensor.{vehicle}_total_driving_range

  range_warning:
    state:
      domain: binary_sensor
      template: "{{ states('sensor.{vehicle}_total_driving_range') | float < 50 }}"
      device_class: problem

  odometer:
    state:
      entity: sensor.{vehicle}_odometer
      device_class: distance
      state_class: total_increasing

  tire_pressure:
    state:
      any:
        - binary_sensor.{vehicle}_tire_pressure_front_left
        - binary_sensor.{vehicle}_tire_pressure_front_right
        - binary_sensor.{vehicle}_tire_pressure_rear_left
        - binary_sensor.{vehicle}_tire_pressure_rear_right

  warning_messages:
    state:
      any:
        - binary_sensor.{vehicle}_fuel_low_level
        - binary_sensor.{vehicle}_smart_key_battery_warning
        - binary_sensor.{vehicle}_washer_fluid_warning
        - binary_sensor.{vehicle}_brake_fluid_warning
        - binary_sensor.{vehicle}_headlight_fault
        - binary_sensor.{vehicle}_headlamp_left_low_fault
        - binary_sensor.{vehicle}_headlamp_right_low_fault
        - binary_sensor.{vehicle}_stop_lamp_left_fault
        - binary_sensor.{vehicle}_stop_lamp_right_fault
        - binary_sensor.{vehicle}_turn_signal_left_front_fault
        - binary_sensor.{vehicle}_turn_signal_right_front_fault
        - binary_sensor.{vehicle}_turn_signal_left_rear_fault
        - binary_sensor.{vehicle}_turn_signal_right_rear_fault

  info_messages:
    state:
      unavailable: true

  windows:
    state:
      any:
        - binary_sensor.{vehicle}_front_left_window
        - binary_sensor.{vehicle}_front_right_window
        - binary_sensor.{vehicle}_rear_left_window
        - binary_sensor.{vehicle}_rear_right_window
    actions:
      open:
        action: kia_uvo.set_windows
        data:
          device_id: {device}
          flwindow: "1"
          frwindow: "1"
          rrwindow: "1"
          rlwindow: "1"
      close:
        action: kia_uvo.set_windows
        data:
          device_id: {device}
          flwindow: "0"
          frwindow: "0"
          rrwindow: "0"
          rlwindow: "0"

  doors:
    state:
      any:
        - binary_sensor.{vehicle}_front_left_door
        - binary_sensor.{vehicle}_front_right_door
        - binary_sensor.{vehicle}_back_left_door
        - binary_sensor.{vehicle}_back_right_door

  lids:
    state:
      any:
        - binary_sensor.{vehicle}_trunk
        - binary_sensor.{vehicle}_hood

  refresh:
    state:
      unavailable: true
    actions:
      refresh:
        action: kia_uvo.force_update
        data:
          device_id: {device}
