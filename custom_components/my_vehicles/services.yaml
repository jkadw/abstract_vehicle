central_locking:
  name: Central Locking
  description: Execute a central-locking action for the selected vehicle if supported.
  target:
    device:
      integration: my_vehicles
  fields:
    action:
      name: Action
      description: Lock action to execute.
      required: true
      selector:
        select:
          options:
            - lock
            - unlock

climate:
  name: Climate
  description: Execute a climate action for the selected vehicle if supported.
  target:
    device:
      integration: my_vehicles
  fields:
    action:
      name: Action
      description: Climate action to execute.
      required: true
      selector:
        select:
          options:
            - start_heating
            - start_cooling
            - stop

ev_charging:
  name: EV Charging
  description: Execute an EV charging action for the selected vehicle if supported.
