lock_vehicle:
  name: Lock Vehicle
  description: Lock the selected vehicle if the capability is supported.
  target:
    device:
      integration: my_vehicles

unlock_vehicle:
  name: Unlock Vehicle
  description: Unlock the selected vehicle if the capability is supported.
  target:
    device:
      integration: my_vehicles

start_climate:
  name: Start Climate
  description: Start climate control for the selected vehicle if supported.
  target:
    device:
      integration: my_vehicles

stop_climate:
  name: Stop Climate
  description: Stop climate control for the selected vehicle if supported.
  target:
    device:
      integration: my_vehicles

start_charging:
  name: Start Charging
  description: Start charging for the selected vehicle if supported.
  target:
    device:
      integration: my_vehicles

stop_charging:
  name: Stop Charging
  description: Stop charging for the selected vehicle if supported.
  target:
    device:
      integration: my_vehicles

horn:
  name: Horn
  description: Trigger the horn for the selected vehicle if supported.
  target:
    device:
      integration: my_vehicles

flash_lights:
  name: Flash Lights
  description: Flash the lights for the selected vehicle if supported.
  target:
    device:
      integration: my_vehicles

turn_on_hazard_lights:
  name: Turn On Hazard Lights
  description: Switch hazard lights on for the selected vehicle if supported.
  target:
    device:
      integration: my_vehicles

turn_off_hazard_lights:
  name: Turn Off Hazard Lights
  description: Switch hazard lights off for the selected vehicle if supported.
  target:
    device:
      integration: my_vehicles

open_windows:
  name: Open Windows
  description: Open the windows for the selected vehicle if supported.
  target:
    device:
      integration: my_vehicles

close_windows:
  name: Close Windows
  description: Close the windows for the selected vehicle if supported.
  target:
    device:
      integration: my_vehicles

refresh:
  name: Refresh Vehicle
  description: Trigger a refresh for the selected vehicle if the adapter supports it.
  target:
    device:
      integration: my_vehicles

diagnostics:
  name: Vehicle Diagnostics
  description: Collect read-only diagnostics for the selected vehicle without executing upstream actions.
  target:
    device:
      integration: my_vehicles
